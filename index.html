<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>弾幕ゲーム（仮）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:600px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#151b38 0,#090b19 48%,#05060d 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:5}
.hidden{display:none!important}
h1{font-size:clamp(32px,10vw,54px);margin:0 0 12px;font-weight:900;letter-spacing:.04em;text-shadow:0 0 24px #667cff}
.sub{opacity:.65;margin-bottom:34px;font-size:14px}
.scorebox{padding:15px 35px;border:1px solid #5364c8;border-radius:18px;background:#11162b;box-shadow:0 0 30px #26346d55;text-align:center;margin-bottom:28px}
.scorebox small{display:block;opacity:.6;font-size:12px;margin-bottom:4px}
.scorebox strong{font-size:31px}
button{width:min(300px,86vw);padding:16px 20px;margin:7px;border:1px solid #6475e8;border-radius:14px;background:linear-gradient(180deg,#293678,#18204b);color:white;font-size:17px;font-weight:800;box-shadow:0 8px 25px #0005}
button:active{transform:scale(.97);background:#34438e}
#gameUI{position:absolute;top:max(15px,env(safe-area-inset-top));left:0;right:0;padding:0 17px;display:flex;justify-content:space-between;z-index:4;font-weight:800;text-shadow:0 2px 5px #000}
#gameUI span{font-size:14px}
#ranking{justify-content:flex-start;padding-top:max(35px,env(safe-area-inset-top))}
#ranking h2{margin:0 0 15px;font-size:30px}
#rankList{width:min(390px,92vw);max-height:58vh;overflow:auto;border:1px solid #303963;border-radius:16px;background:#0d1122}
.rank{display:grid;grid-template-columns:48px 1fr 90px;gap:5px;align-items:center;padding:13px 15px;border-bottom:1px solid #202642}
.rank:last-child{border-bottom:0}
.rank .num{font-weight:900;color:#94a4ff}
.rank .date{font-size:12px;opacity:.65}
.rank .pts{text-align:right;font-weight:900}
.empty{padding:28px;text-align:center;opacity:.5}
#controls{position:absolute;left:0;right:0;bottom:0;height:28%;min-height:145px;display:flex;z-index:3}
.ctrl{flex:1;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:300;color:#fff8;background:linear-gradient(transparent,#11193633)}
#gameOver .result{font-size:42px;font-weight:900;margin:5px 0 22px}
#gameOver .new{font-size:13px;color:#9eafff;margin-bottom:8px}
.tip{font-size:12px;opacity:.45;margin-top:17px}
</style>
<style>
.gameOverButtons{display:flex;flex-direction:column;gap:10px;width:min(360px,88vw);margin:18px auto 0}
.rankRow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.09)}
.rankNo{opacity:.65}
.rankName{font-weight:700;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankScore{font-variant-numeric:tabular-nums}
.rankDate{grid-column:2/-1;opacity:.45;font-size:11px;text-align:left;margin-top:-8px}
</style></head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div id="title" class="screen">
  <h1>弾幕ゲーム（仮）</h1>
  <div class="sub">左右に動いて、できるだけ長く生き残れ。</div>
  <div class="scorebox"><small>HIGH SCORE</small><strong id="highScore">0</strong></div><input id="nameInput" maxlength="10" placeholder="名前を入力（10文字まで）" autocomplete="off">
  <button id="startBtn">START</button>
  <button id="rankBtn">ランキング</button>
  <div class="tip">画面の左半分・右半分をタップして操作</div>
</div>

<div id="ranking" class="screen hidden">
  <h2>ランキング</h2>
  <div id="rankList"></div>
  <button id="resetRankBtn">ランキングをリセット</button><button id="backBtn">戻る</button>
</div>

<div id="gameUI" class="hidden">
  <span id="score">SCORE 0</span>
  <span id="time">TIME 0.0</span><span id="elapsed">0.0s</span>
</div>

<div id="controls" class="hidden">
  <div class="ctrl" id="left">‹</div>
  <div class="ctrl" id="right">›</div>
</div>

<div id="gameOver" class="screen hidden">
  <div class="sub">GAME OVER</div>
  <div class="result" id="finalScore">0</div>
  <div id="newRecord" class="new hidden">★ NEW HIGH SCORE ★</div>
  <button id="retryBtn">もう一度</button>
  <button id="titleBtn">タイトルへ</button>
</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const app=document.getElementById('app');
let W,H,dpr,player,bullets=[],particles=[],running=false,startTime,last=0,score=0,spawnTimer=0,patternTimer=0,pattern=0,keys={left:false,right:false};
let high=Number(localStorage.getItem('danmakuHigh')||0);
let lastPattern=-1;
let ranking=[];
const RANK_KEY='danmakuRanking';
const NAME_KEY='danmakuName';

function loadRanking(){
  try{
    const raw=localStorage.getItem(RANK_KEY);
    const parsed=raw?JSON.parse(raw):[];
    ranking=Array.isArray(parsed)?parsed.filter(r=>r&&Number.isFinite(Number(r.score))):[];
    ranking=ranking.map(r=>({
      name:(typeof r.name==='string'&&r.name.trim())?r.name.trim().slice(0,10):'PLAYER',
      score:Math.max(0,Math.floor(Number(r.score)||0)),
      date:(typeof r.date==='string'&&r.date)?r.date:new Date().toLocaleDateString('ja-JP')
    }));
    ranking.sort((a,b)=>b.score-a.score);
    if(ranking.length>30) ranking=ranking.slice(0,30);
  }catch(e){
    ranking=[];
  }
}

function saveRanking(){
  try{
    localStorage.setItem(RANK_KEY,JSON.stringify(ranking));
    // Verify the browser actually stored it.
    const check=JSON.parse(localStorage.getItem(RANK_KEY)||'[]');
    return Array.isArray(check);
  }catch(e){
    return false;
  }
}

function getCurrentName(){
  const input=document.getElementById('nameInput');
  const value=(input?.value||'').trim().replace(/\s+/g,' ').slice(0,10);
  return value||'PLAYER';
}

function renderRanking(){
  const el=document.getElementById('rankList');
  if(!el)return;
  if(!ranking.length){
    el.innerHTML='<div style="opacity:.65;padding:20px">まだランキングがありません</div>';
    return;
  }
  el.innerHTML=ranking.map((r,i)=>{
    const name=esc(r.name||'PLAYER');
    return `<div class="rankRow">
      <span class="rankNo">${i+1}</span>
      <span class="rankName">${name}</span>
      <span class="rankScore">${Number(r.score).toLocaleString()}<small> pt</small></span>
      <span class="rankDate">${esc(r.date||'')}</span>
    </div>`;
  }).join('');
}

document.getElementById('resetRankBtn').onclick=()=>{
  if(!confirm('これまでのランキング記録をすべて削除しますか？')) return;
  try{
    localStorage.removeItem('danmakuRanking');
    if(typeof RANK_KEY!=='undefined') localStorage.removeItem(RANK_KEY);
  }catch(e){}
  ranking=[];
  renderRanking();
};
function addRankingScore(finalScore){
  const name=getCurrentName();
  try{localStorage.setItem(NAME_KEY,name);}catch(e){}
  ranking.push({
    name:name,
    score:Math.max(0,Math.floor(finalScore)),
    date:new Date().toLocaleDateString('ja-JP')
  });
  ranking.sort((a,b)=>b.score-a.score);
  ranking=ranking.slice(0,30);
  saveRanking();
  renderRanking();
}

loadRanking();
document.getElementById('highScore').textContent=high.toLocaleString();
document.getElementById('rankBtn').onclick=()=>{renderRanking();show('ranking')};
document.getElementById('backBtn').onclick=()=>show('title');
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('resultTitleBtn').onclick=()=>{
  running=false;
  keys.left=false;keys.right=false;bullets=[];
  show('title');
};

function startGame(){const name=(document.getElementById('nameInput').value.trim()||'PLAYER').slice(0,10);localStorage.setItem('danmakuName',name);
  player={x:W/2,y:H*.78,r:10,speed:W*.48};
  bullets=[];particles=[];score=0;spawnTimer=0;patternTimer=0;pattern=0;lastPattern=-1;running=true;startTime=performance.now();last=startTime;
  show('game');requestAnimationFrame(loop);
}
function endGame(){
  running=false;
  const final=Math.floor(score);
  const isNew=final>high;
  if(isNew){high=final;localStorage.setItem('danmakuHigh',high);document.getElementById('highScore').textContent=high.toLocaleString()}
  addRankingScore(score);
  document.getElementById('finalScore').textContent=final.toLocaleString();
  document.getElementById('newRecord').classList.toggle('hidden',!isNew);
  show('gameOver');
}

function addBullet(x,y,vx,vy,r=6){
  bullets.push({x,y,vx,vy,r,speed:Math.hypot(vx,vy)});
}
function spawn(){
  const t=(performance.now()-startTime)/1000;
  const H=Math.max(1,canvas.height),W=Math.max(1,canvas.width),cx=W/2;
  const speed=H*(.105+Math.min(t,90)*.0009);
  const hard=(t%30)<7;

  // Hard zone: chaotic and intentionally asymmetrical.
  if(hard){
    const mode=Math.floor(Math.random()*9);
    if(mode===0){
      const x=Math.random()*W*.7;
      for(let i=0;i<16;i++){
        const a=-.25+(i*.11)+Math.sin(i*1.7)*.16;
        const sp=speed*(.55+Math.random()*.35);
        addBullet(x+i*3,-10-i*10,Math.cos(a)*sp,Math.sin(a)*sp,4.2);
      }
    }else if(mode===1){
      const left=Math.random()<.5;
      for(let i=0;i<18;i++){
        const y=Math.random()*H*.55, a=left?(.08+i*.035):Math.PI-(.08+i*.035);
        const sp=speed*(.45+Math.random()*.4);
        addBullet(left?-10:W+10,y,Math.cos(a)*sp,Math.sin(a)*sp,4.2);
      }
    }else if(mode===2){
      for(let i=0;i<22;i++){
        const x=Math.random()*W;
        const a=(Math.random()-.5)*1.35;
        const sp=speed*(.42+Math.random()*.5);
        addBullet(x,-10,Math.sin(a)*sp,Math.cos(a)*sp,3.8);
      }
    }else if(mode===3){
      const sx=Math.random()<.5?-20:W+20;
      for(let i=0;i<15;i++){
        const y=30+i*34+Math.random()*30;
        const a=Math.atan2(H*.65-y,cx-sx)+(Math.random()-.5)*.8;
        const sp=speed*(.5+Math.random()*.35);
        addBullet(sx,y,Math.cos(a)*sp,Math.sin(a)*sp,4.5);
      }
    }else if(mode===4){
      const base=Math.random()*W;
      for(let i=0;i<14;i++){
        const a=Math.sin(i*.9)*.65+(Math.random()-.5)*.35;
        const x=base+Math.sin(i*1.3)*W*.14;
        addBullet(x,-12-i*12,Math.sin(a)*speed*.7,Math.cos(a)*speed*.7,4);
      }
    }else if(mode===5){
      for(let i=0;i<12;i++){
        const x=W*(.05+Math.random()*.9), y=-10-i*16;
        const a=-.8+Math.random()*1.9;
        const sp=speed*(.45+Math.random()*.45);
        addBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,4);
      }
    }else if(mode===6){
      const side=Math.random()<.5?-1:1;
      for(let i=0;i<17;i++){
        const a=(side<0?.15:Math.PI-.15)+Math.sin(i*.55)*.5+(Math.random()-.5)*.3;
        const sp=speed*(.5+Math.random()*.4);
        addBullet(side<0?-15:W+15,Math.random()*H*.65,Math.cos(a)*sp,Math.sin(a)*sp,4.3);
      }
    }else if(mode===7){
      const sx=W*(.1+Math.random()*.8);
      for(let i=0;i<13;i++){
        const a=Math.atan2(H*.85,sx-cx)+(i-6)*.12+Math.sin(i)*.22;
        addBullet(sx,-8-i*8,Math.cos(a)*speed*.65,Math.sin(a)*speed*.65,4.2);
      }
    }else{
      for(let i=0;i<20;i++){
        const edge=Math.floor(Math.random()*4),a=Math.random()*Math.PI*2;
        let x,y;
        if(edge===0){x=Math.random()*W;y=-15;}
        else if(edge===1){x=W+15;y=Math.random()*H*.7;}
        else if(edge===2){x=Math.random()*W;y=-15;}
        else{x=-15;y=Math.random()*H*.7;}
        const sp=speed*(.45+Math.random()*.5);
        addBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,3.8);
      }
    }
    return;
  }

  // 20 normal patterns. No immediate repeat; patterns deliberately use
  // different origins, densities, angles and timing instead of mirror symmetry.
  let type=Math.floor(Math.random()*20);
  if(type===lastPattern) type=(type+1+Math.floor(Math.random()*19))%20;
  lastPattern=type;

  switch(type){
    case 0:{ // loose fan
      const x=W*(.1+Math.random()*.8),n=6+Math.floor(Math.random()*7),c=.2+Math.random()*1.1;
      for(let i=0;i<n;i++){const a=c+(i-(n-1)/2)*.13;addBullet(x,-12,Math.cos(a)*speed*.7,Math.sin(a)*speed*.7,4.5);}break;
    }
    case 1:{ // left rake
      for(let i=0;i<11;i++)addBullet(-15-i*8,-10-i*30,speed*(.5+Math.random()*.2),speed*(.55+Math.random()*.3),4);break;
    }
    case 2:{ // right rake
      for(let i=0;i<11;i++)addBullet(W+15+i*8,-15-i*27,-speed*(.45+Math.random()*.25),speed*(.55+Math.random()*.3),4);break;
    }
    case 3:{ // drifting spiral
      const x=W*(.2+Math.random()*.6),p=Math.random()*6.28;
      for(let i=0;i<12;i++){const a=p+i*.32;addBullet(x+Math.sin(i*.65)*W*.08,-10-i*9,Math.cos(a)*speed*.62,Math.sin(a)*speed*.62,4);}break;
    }
    case 4:{ // aim burst
      const sx=Math.random()*W,base=Math.atan2(player.y+20,sx-player.x);
      for(let i=0;i<9;i++){const a=base+(i-4)*.09,sp=speed*(.55+Math.random()*.25);addBullet(sx,-8,Math.cos(a)*sp,Math.sin(a)*sp,4.2);}break;
    }
    case 5:{ // broken V
      const x=W*(.1+Math.random()*.8);
      for(let i=0;i<10;i++){const a=.65+(i-2)*.12;addBullet(x+(i-4)*10,-8,Math.cos(a)*speed*.65,Math.sin(a)*speed*.65,4);}break;
    }
    case 6:{ // random rain
      for(let i=0;i<17;i++){const a=(Math.random()-.5)*.8,sp=speed*(.45+Math.random()*.4);addBullet(Math.random()*W,-10,Math.sin(a)*sp,Math.cos(a)*sp,3.8);}break;
    }
    case 7:{ // left curve
      for(let i=0;i<13;i++){const a=.12+Math.sin(i*.62)*.42,sp=speed*.65;addBullet(-10,25+i*35,Math.cos(a)*sp,Math.sin(a)*sp,4);}break;
    }
    case 8:{ // right curve
      for(let i=0;i<13;i++){const a=3.0+Math.sin(i*.7)*.4,sp=speed*.65;addBullet(W+10,35+i*34,Math.cos(a)*sp,Math.sin(a)*sp,4);}break;
    }
    case 9:{ // delayed diagonal ladder
      for(let i=0;i<10;i++){const x=W*(.04+i*.105),a=.25+(i%4)*.1,sp=speed*(.5+(i%3)*.08);addBullet(x,-10-i*25,Math.sin(a)*sp,Math.cos(a)*sp,4);}break;
    }
    case 10:{ // narrow rain
      const x=Math.random()*W;
      for(let i=0;i<16;i++){const a=.5+(Math.random()-.5)*.3,sp=speed*(.45+Math.random()*.3);addBullet(x+(i%3)*9,-10-i*20,Math.sin(a)*sp,Math.cos(a)*sp,3.8);}break;
    }
    case 11:{ // hook left
      for(let i=0;i<12;i++){const a=.1+i*.055;addBullet(-12+i*10,-12+i*13,Math.cos(a)*speed*.65,Math.sin(a)*speed*.65,4);}break;
    }
    case 12:{ // hook right
      for(let i=0;i<12;i++){const a=3.04-i*.055;addBullet(W+12-i*10,-12+i*13,Math.cos(a)*speed*.65,Math.sin(a)*speed*.65,4);}break;
    }
    case 13:{ // offset burst
      const x=W*(.15+Math.random()*.7);
      for(let i=0;i<14;i++){const a=.15+(Math.random()-.5)*1.1,sp=speed*(.45+Math.random()*.45);addBullet(x,-10,Math.cos(a)*sp,Math.sin(a)*sp,3.8);}break;
    }
    case 14:{ // one-sided scatter
      const left=Math.random()<.5;
      for(let i=0;i<13;i++){const y=20+i*38+Math.random()*20,a=left?Math.random()*.9:Math.PI-Math.random()*.9;addBullet(left?-10:W+10,y,Math.cos(a)*speed*.65,Math.sin(a)*speed*.65,4);}break;
    }
    case 15:{ // falling zigzag stream
      for(let i=0;i<14;i++){const x=W*.5+Math.sin(i*1.15)*W*.22,a=(Math.random()-.5)*.5,sp=speed*(.5+Math.random()*.2);addBullet(x,-10-i*18,Math.sin(a)*sp,Math.cos(a)*sp,4);}break;
    }
    case 16:{ // offset diagonal curtain
      const offset=Math.random()*W*.35;
      for(let i=0;i<15;i++){const x=(i/15)*W+offset-W*.15,a=.25+(Math.random()-.5)*.3,sp=speed*(.45+Math.random()*.25);addBullet(x,-10-i*14,Math.sin(a)*sp,Math.cos(a)*sp,3.8);}break;
    }
    case 17:{ // sparse heavy bullets
      for(let i=0;i<7;i++){const x=Math.random()*W,a=(Math.random()-.5)*1.1,sp=speed*(.85+Math.random()*.25);addBullet(x,-12,Math.sin(a)*sp,Math.cos(a)*sp,6);}break;
    }
    case 18:{ // moving origin
      const x=W*(.1+Math.random()*.8);
      for(let i=0;i<12;i++){const xx=x+Math.sin(i*.8)*W*.12,a=.15+Math.sin(i*.55)*.55;addBullet(xx,-10-i*15,Math.sin(a)*speed*.65,Math.cos(a)*speed*.65,4);}break;
    }
    case 19:{ // asymmetric wave
      const base=W*(.15+Math.random()*.45);
      for(let i=0;i<15;i++){const x=base+Math.sin(i*.5)*W*.28+i*4,a=.35+Math.sin(i*.72)*.38;addBullet(x,-8-i*17,Math.sin(a)*speed*.6,Math.cos(a)*speed*.6,4);}break;
    }
  }
}
function update(dt){
  const t=(performance.now()-startTime)/1000;
  score=t*60;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  player.x+=dir*player.speed*dt;
  player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x));

  // 指操作がない場合でも左右タップで操作できる
  spawnTimer-=dt; patternTimer+=dt;
  const interval=Math.max(.34,.68-t*.0032);
  if(spawnTimer<=0){spawn();spawnTimer=interval}
  bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
  bullets=bullets.filter(b=>b.y<H+30 && b.x>-50 && b.x<W+50);

  for(const b of bullets){
    const dx=b.x-player.x,dy=b.y-player.y;
    if(dx*dx+dy*dy<(b.r+player.r-2)**2){endGame();return}
  }
  // 粒子
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 星
  ctx.fillStyle='#ffffff22';
  for(let i=0;i<45;i++){
    const x=(i*83)%W,y=((i*137)+(performance.now()*.01*i))%H;
    ctx.fillRect(x,y,1.5,1.5);
  }
  // 弾
  for(const b of bullets){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2);ctx.fillStyle='#ff557722';ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#ff718c';ctx.fill();
    ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.25,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  }
  // プレイヤー
  if(player){
    ctx.beginPath();ctx.arc(player.x,player.y,player.r+9,0,Math.PI*2);ctx.fillStyle='#6c7cff22';ctx.fill();
    ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle='#aab5ff';ctx.fill();
    ctx.beginPath();ctx.arc(player.x,player.y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  }
}
function loop(now){
  if(!running)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();
  document.getElementById('score').textContent='SCORE '+Math.floor(score).toLocaleString();
  const elapsed=(now-startTime)/1000;document.getElementById('time').textContent='TIME '+elapsed.toFixed(1);document.getElementById('elapsed').textContent=elapsed.toFixed(1)+'s';
  if(running)requestAnimationFrame(loop);
}

function bind(el,side){
  const down=e=>{e.preventDefault();keys[side]=true};
  const up=e=>{e.preventDefault();keys[side]=false};
  el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
}
bind(document.getElementById('left'),'left');bind(document.getElementById('right'),'right');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
show('title');
